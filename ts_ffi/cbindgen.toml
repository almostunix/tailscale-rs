language = "C"
include_guard = "TAILSCALE_H"
cpp_compat = true
documentation = true

[export]
prefix = "ts_"
renaming_overrides_prefixing = true

include = [
    "sockaddr",
    "sockaddr_in",
    "sockaddr_in6",
    "sockaddr_storage",
    "in_addr",
    "in6_addr",
    "sa_family",
]

# ESP-IDF's heap API, declared in esp_alloc.rs for Rust's own use: the firmware has its own header.
exclude = ["heap_caps_malloc", "heap_caps_aligned_alloc", "heap_caps_realloc", "heap_caps_free"]

[export.rename]
AF_INET = "TS_AF_INET"
AF_INET6 = "TS_AF_INET6"
MAX_SOCKADDR_DATA_SIZE = "TS_MAX_SOCKADDR_DATA_SIZE"
