[package]
name = "ts_ffi"
version.workspace = true
description = "c ffi bindings for tailscale-rs"
categories = ["api-bindings", "network-programming"]
keywords = ["tailscale", "c", "cbindgen", "bindings", "ffi"]

repository.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
tailscale.workspace = true
ts_keys.workspace = true

# Explicitly NOT "full". That pulls tokio's `signal` and `process` features,
# and `signal` brings signal-hook-registry, which does not compile for
# xtensa-esp32s3-espidf: ESP-IDF's libc has no siginfo_t, SIGKILL, SIGSTOP,
# SA_RESTART, SA_SIGINFO, or sigaction.sa_sigaction. Nothing here uses signals
# or subprocesses, so listing what we actually need fixes the cross-build and
# trims the native one at the same time.
tokio = { workspace = true, features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }
tracing = { workspace = true, features = ["release_max_level_info"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

[build-dependencies]
cbindgen = "0.29"

[lib]
name = "tailscalers"
crate-type = ["cdylib", "staticlib"]

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["cbindgen"]
