[package]
name = "ts_ffi"
version.workspace = true
description = "c ffi bindings for tailscale-rs"
categories = ["api-bindings", "network-programming"]
keywords = ["tailscale", "c", "cbindgen", "bindings", "ffi"]

repository.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
tailscale.workspace = true
ts_keys.workspace = true
ts_tls_util.workspace = true

# Not "full": its `signal` feature does not build for ESP-IDF, and nothing here needs signals.
tokio = { workspace = true, features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }
tracing = { workspace = true, features = ["release_max_level_info"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

[features]
# TS_TEST_* fault injection, for native test runs; see ts_runtime and ts_netcheck.
test-hooks = ["tailscale/test-hooks"]
# ESP-IDF: log the tokio worker's stack low-water mark as it falls.
diagnostics = []

[dev-dependencies]
ts_netstack_smoltcp = { workspace = true, features = ["tokio"] }
ts_netstack_smoltcp_core.workspace = true
ts_netstack_smoltcp_socket = { workspace = true, features = ["tokio"] }

[build-dependencies]
cbindgen = "0.29"

[lib]
name = "tailscalers"
crate-type = ["cdylib", "staticlib"]

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["cbindgen"]
